name: Robot du Desk

# Toutes les 10 minutes : récupère l'agenda, FinancialJuice, les news futures, les options NDX/SPX et les prix MNQ/MES,
# puis publie le Desk et ses données sur GitHub Pages.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données
        run: node robot.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Options Nasdaq 100 / S&P 500 (Yahoo Finance). Si cette étape échoue, le Desk est publié quand même.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Options NDX et SPX
        continue-on-error: true
        run: |
          pip install --quiet yfinance
          python options.py
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Prix et niveaux des contrats micro MNQ / MES (Yahoo Finance). Même règle : une panne ne bloque rien.
      - name: Futures MNQ et MES
        continue-on-error: true
        run: python futpx.py
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
