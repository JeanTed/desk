# Diagnostic ponctuel : télécharge les bulletins CME (options Nasdaq 100 et S&P 500)
# et affiche leur structure dans le journal, pour écrire le lecteur définitif.
# Se lance à la main : onglet Actions > « Diagnostic CME » > Run workflow.
name: Diagnostic CME
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les bulletins
        continue-on-error: true
        run: |
          B=https://www.cmegroup.com/daily_bulletin/current
          for f in Section40_Nasdaq_100_And_E_Mini_Nasdaq_100_Options \
                   Section47_E_Mini_S_And_P_500_Call_Options \
                   Section48_E_Mini_S_And_P_500_Put_Options; do
            code=$(curl -sS -m 60 -A "Mozilla/5.0" -o "$f.pdf" -w "%{http_code}" "$B/$f.pdf" || echo ERR)
            echo "=== $f : HTTP $code, $(stat -c%s "$f.pdf" 2>/dev/null || echo 0) octets"
          done
      - name: Structure des bulletins
        continue-on-error: true
        run: |
          for f in *.pdf; do
            echo; echo "################ $f"
            pdftotext -layout "$f" "$f.txt" 2>&1 | head -3
            echo "--- lignes de titres (CALLS / PUTS / OPT) :"
            grep -nE "CALLS|PUTS|OPT|WEEKLY|EOM|EMINI|E-MINI" "$f.txt" | head -40
            echo "--- 25 premières lignes de données d'un bloc :"
            grep -nE "^ *[0-9]{4,5} " "$f.txt" | head -25
          done
